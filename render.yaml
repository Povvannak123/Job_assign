# Render Blueprint — Job Assign Management System
# Docs: https://render.com/docs/blueprint-spec
#
# ══════════════════════════════════════════════════════════════════
# REQUIRED SETUP AFTER FIRST DEPLOY
# ══════════════════════════════════════════════════════════════════
# In Render Dashboard → each service → Environment, set:
#
#  Backend (job-assign-api):
#    APP_KEY      → run: php artisan key:generate --show
#                   (looks like: base64:xxxxxx...=)
#    APP_URL      → https://<job-assign-api>.onrender.com
#    FRONTEND_URL → https://<job-assign-app>.onrender.com
#    SANCTUM_STATEFUL_DOMAINS → <job-assign-app>.onrender.com
#
#  Frontend (job-assign-app):
#    VITE_API_URL → https://<job-assign-api>.onrender.com/api/v1
#
# After setting these vars, trigger a manual re-deploy for both services.
# ══════════════════════════════════════════════════════════════════

databases:
  - name: job-assign-db
    databaseName: job_assign_db
    user: postgres
    plan: free

services:
  # ─── Laravel Backend ──────────────────────────────────────────────
  - type: web
    name: job-assign-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    httpPort: 80
    healthCheckPath: /up
    plan: free
    envVars:
      - key: APP_NAME
        value: "Job Assign Management System"
      - key: APP_ENV
        value: production
      # Laravel encryption key — generated with: php artisan key:generate --show
      # This value is safe to store here; rotate it if you suspect a breach.
      - key: APP_KEY
        value: base64:2EseCFonH53Sxy+rkvnN4MaRjfsfp6eXAkKOkyAolpY=
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh

      # ── Initial admin login credentials ──────────────────────────────────────
      # Change these to your real admin staff ID and password.
      # After first deploy you can update them from the admin panel instead.
      - key: ADMIN_STAFF_ID
        value: "00001"
      - key: ADMIN_PASSWORD
        sync: false

      # Set this after your first deploy to the actual backend URL
      - key: APP_URL
        sync: false

      # PostgreSQL — automatically wired from the database above
      - key: DB_CONNECTION
        value: pgsql
      # DATABASE_URL is the primary connection string used by Laravel.
      # The individual vars below are fallbacks; the entrypoint also
      # parses DATABASE_URL directly for the PostgreSQL readiness check.
      - key: DATABASE_URL
        fromDatabase:
          name: job-assign-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: job-assign-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-assign-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: job-assign-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: job-assign-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-assign-db
          property: password

      # SSL mode for PostgreSQL — use "require" for Neon or other cloud DBs
      - key: DB_SSLMODE
        value: require

      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr

      # Set these after your first deploy to the actual frontend URL
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false

  # ─── React Frontend ───────────────────────────────────────────────
  - type: web
    name: job-assign-app
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    httpPort: 80
    plan: free
    envVars:
      # ⚠ REQUIRED: Set this to your actual backend URL in Render's dashboard.
      # Go to: job-assign-app → Environment → VITE_API_URL
      # Value:  https://job-assign-backend.onrender.com/api/v1
      # Then click "Save Changes" and trigger a Manual Deploy.
      # This variable is BAKED into the Docker image at build time.
      - key: VITE_API_URL
        value: https://job-assign-backend.onrender.com/api/v1
