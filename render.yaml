# Render Blueprint — Job Assign Management System
# Docs: https://render.com/docs/blueprint-spec
#
# ══════════════════════════════════════════════════════════════════
# REQUIRED SETUP AFTER FIRST DEPLOY
# ══════════════════════════════════════════════════════════════════
# In Render Dashboard → each service → Environment, set:
#
#  Backend (job-assign-api):
#    APP_KEY      → run: php artisan key:generate --show
#                   (looks like: base64:xxxxxx...=)
#    APP_URL      → https://<job-assign-api>.onrender.com
#    FRONTEND_URL → https://<job-assign-app>.onrender.com
#    SANCTUM_STATEFUL_DOMAINS → <job-assign-app>.onrender.com
#
#  Frontend (job-assign-app):
#    VITE_API_URL → https://<job-assign-api>.onrender.com/api/v1
#
# After setting these vars, trigger a manual re-deploy for both services.
# ══════════════════════════════════════════════════════════════════

databases:
  - name: job-assign-db
    databaseName: job_assign_db
    user: postgres
    plan: free

services:
  # ─── Laravel Backend ──────────────────────────────────────────────
  - type: web
    name: job-assign-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    httpPort: 80
    healthCheckPath: /up
    plan: free
    envVars:
      - key: APP_NAME
        value: "Job Assign Management System"
      - key: APP_ENV
        value: production
      # Laravel encryption key — generated with: php artisan key:generate --show
      # This value is safe to store here; rotate it if you suspect a breach.
      - key: APP_KEY
        value: base64:2EseCFonH53Sxy+rkvnN4MaRjfsfp6eXAkKOkyAolpY=
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh

      # Set this after your first deploy to the actual backend URL
      - key: APP_URL
        sync: false

      # PostgreSQL — automatically wired from the database above
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: job-assign-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-assign-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: job-assign-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: job-assign-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-assign-db
          property: password

      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr

      # Set these after your first deploy to the actual frontend URL
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false

  # ─── React Frontend ───────────────────────────────────────────────
  - type: web
    name: job-assign-app
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    httpPort: 80
    plan: free
    envVars:
      # Render passes env vars as Docker build args automatically.
      # Set this to your backend URL before deploying:
      # https://<your-backend-name>.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
